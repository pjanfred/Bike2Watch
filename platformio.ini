[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; The default 4MB partition table gives each OTA app slot only 1.31MB,
; which HTTPClient/WiFiClientSecure's mbedTLS (added for the GitHub
; update check, see update_check.h) overflows by a few KB. This project
; has no SPIFFS/LittleFS usage at all (settings live in NVS via
; Preferences), so min_spiffs.csv -- arduino-esp32's standard scheme for
; exactly this case -- trades that unused spiffs partition for ~650KB
; more per OTA app slot, while keeping the dual-OTA-partition layout
; both the browser upload and the GitHub update check rely on.
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    knolleary/PubSubClient@^2.8
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -D DEBUG_LOG=1
    -D BOARD_ENV=\"esp32dev\"

; Same firmware, built for ESP32-S3 dev boards (e.g. ESP32-S3-DevKitC-1).
; The BLE stack (NimBLE) and all WiFi/OTA/storage APIs used here are
; identical across ESP32 and ESP32-S3 -- only the board ID differs. The
; S3-DevKitC-1's onboard status LED is an addressable WS2812 on GPIO48
; rather than a plain LED on GPIO2 like the classic ESP32 boards, so
; LED_PIN/LED_IS_RGB (include/config.h) are overridden below to match --
; see setLed() in main.cpp. A board with a plain LED elsewhere (or none at
; all) should override these to match instead.
[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Board default assumes 8MB flash; many S3-DevKitC-1 boards in the wild
; (and clones) ship with only 4MB. Override to match, otherwise the ROM
; bootloader's flash-size probe fails and the board reboot-loops.
; board_upload.flash_size is what actually gets baked into the image
; header (board_build.flash_size only affects partition table sizing).
board_build.flash_size = 4MB
; See the esp32dev env above for why min_spiffs.csv (not default.csv) --
; same flash-overflow fix, same reasoning (no SPIFFS/LittleFS usage).
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    knolleary/PubSubClient@^2.8
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -D DEBUG_LOG=1
    -D LED_PIN=48
    -D LED_IS_RGB=1
    -D BOARD_ENV=\"esp32-s3-devkitc-1\"

[env:native]
platform = native
build_flags = -std=c++17
test_build_src = false
