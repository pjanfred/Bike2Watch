name: Beta firmware

# Every push to the `beta` branch runs the unit tests, builds firmware for
# every board and publishes it as a GitHub *pre-release* (tag
# v<FIRMWARE_VERSION>-beta.<run number>), so changes can be flashed and
# tested before they are merged to `main` and released for real.
#
# Pre-releases are invisible to GitHub's /releases/latest, which is what the
# firmware's own update check uses, so regular users never get offered a
# beta. To try one, download the .bin for your board from the pre-release
# and flash it through the web UI's Firmware Update page (or
# `pio run -t upload`). Flash the latest stable release to go back.
#
# FIRMWARE_VERSION in include/version.h is left untouched; the beta suffix
# is injected at build time via PLATFORMIO_BUILD_FLAGS (see version.h).

on:
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          base=$(grep -oP '(?<=FIRMWARE_VERSION ")[^"]+' include/version.h)
          echo "value=${base}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -U platformio

      - name: Run native unit tests
        run: pio test -e native

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-s3-devkitc-1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -U platformio

      - name: Build firmware (${{ matrix.env }})
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION=\\\"${VERSION}\\\"" pio run -e ${{ matrix.env }}
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "bike2watch-${{ matrix.env }}-v${VERSION}.bin"
          sha256sum "bike2watch-${{ matrix.env }}-v${VERSION}.bin" > "bike2watch-${{ matrix.env }}-v${VERSION}.bin.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            bike2watch-${{ matrix.env }}-v${{ needs.test.outputs.version }}.bin
            bike2watch-${{ matrix.env }}-v${{ needs.test.outputs.version }}.bin.sha256

  prerelease:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Beta v${{ needs.test.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*/*.bin
            artifacts/*/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old beta pre-releases (keep the newest 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-beta\\.")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
